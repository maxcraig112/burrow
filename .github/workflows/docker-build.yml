name: RC release

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".ko.yaml"
      - "go.mod"
      - "go.sum"

jobs:
  rc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Calculate RC version
        id: version
        run: |
          base=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$base" ]; then base="v0.0.0"; fi
          latest_rc=$(git tag --sort=-v:refname | grep -E "^${base}-rc[0-9]+$" | head -1)
          if [ -z "$latest_rc" ]; then
            rc_num=1
          else
            rc_num=$(echo "$latest_rc" | grep -oE '[0-9]+$')
            rc_num=$((rc_num + 1))
          fi
          echo "version=${base}-rc${rc_num}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/exchange-linux-amd64 ./cmd/exchange
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/relay-linux-amd64    ./cmd/relay

          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/burrow-linux-amd64       .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/burrow-darwin-amd64      .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/burrow-darwin-arm64      .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/burrow-windows-amd64.exe .

      # ── Docker Hub (RC tag only, no latest) ──────────────────────────────────
      - uses: ko-build/setup-ko@v0.8

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          V=${{ steps.version.outputs.version }}
          KO_DOCKER_REPO=${{ secrets.DOCKERHUB_USERNAME }}/burrow-exchange \
            ko build --bare --platform=linux/amd64,linux/arm64 --tags "$V" ./cmd/exchange
          KO_DOCKER_REPO=${{ secrets.DOCKERHUB_USERNAME }}/burrow-relay \
            ko build --bare --platform=linux/amd64,linux/arm64 --tags "$V" ./cmd/relay

      # ── GitHub pre-release ───────────────────────────────────────────────────
      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
