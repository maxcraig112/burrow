name: RC release

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"

jobs:
  rc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Calculate RC version
        id: version
        run: |
          base=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$base" ]; then base="v0.0.0"; fi
          latest_rc=$(git tag --sort=-v:refname | grep -E "^${base}-rc[0-9]+$" | head -1)
          if [ -z "$latest_rc" ]; then
            rc_num=1
          else
            rc_num=$(echo "$latest_rc" | grep -oE '[0-9]+$')
            rc_num=$((rc_num + 1))
          fi
          echo "version=${base}-rc${rc_num}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/exchange-linux-amd64 ./cmd/exchange
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/relay-linux-amd64    ./cmd/relay

          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/burrow-linux-amd64       ./cmd/burrow
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/burrow-darwin-amd64      ./cmd/burrow
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/burrow-darwin-arm64      ./cmd/burrow
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/burrow-windows-amd64.exe ./cmd/burrow

      # ── Docker Hub (RC tag only, no latest) ──────────────────────────────────
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push exchange to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/exchange.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/burrow-exchange:${{ steps.version.outputs.version }}

      - name: Push relay to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/burrow-relay:${{ steps.version.outputs.version }}

      # ── GitHub pre-release ───────────────────────────────────────────────────
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
