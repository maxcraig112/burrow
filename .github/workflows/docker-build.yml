name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    env:
      REGION: us-central1

    steps:
      - uses: actions/checkout@v4

      # ── GCP (Artifact Registry + Cloud Run) ──────────────────────────────
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push to Artifact Registry
        run: |
          chmod +x scripts/docker-build.sh
          ./scripts/docker-build.sh ${{ secrets.GCP_PROJECT_ID }} ${{ env.REGION }}

      - name: Deploy exchange to Cloud Run
        run: |
          gcloud run deploy burrow-exchange \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/burrow/exchange:latest" \
            --region="${{ env.REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --quiet

      # ── Docker Hub ───────────────────────────────────────────────────────
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push exchange to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/exchange.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/burrow-exchange:latest

      - name: Push relay to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/burrow-relay:latest
