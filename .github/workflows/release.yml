name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Calculate next version
        id: version
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then latest="v0.0.0"; fi
          version=${latest#v}
          major=$(echo $version | cut -d. -f1)
          minor=$(echo $version | cut -d. -f2)
          patch=$(echo $version | cut -d. -f3)
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=v${major}.${minor}.${patch}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/exchange-linux-amd64 ./cmd/exchange
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/relay-linux-amd64    ./cmd/relay

          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/burrow-linux-amd64       ./cmd/burrow
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/burrow-darwin-amd64      ./cmd/burrow
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/burrow-darwin-arm64      ./cmd/burrow
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/burrow-windows-amd64.exe ./cmd/burrow

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: dist/*

      # ── Docker Hub (versioned tag + latest) ──────────────────────────────────
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push exchange to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/exchange.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/burrow-exchange:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/burrow-exchange:${{ steps.version.outputs.version }}

      - name: Push relay to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/burrow-relay:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/burrow-relay:${{ steps.version.outputs.version }}

