<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burrow</title>
  <link rel="stylesheet" href="/static/vendor/pico.classless.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
<main x-data="uploadForm">
  <article>
    <hgroup>
      <h2 class="logo">Burrow</h2>
      <p>Send files to the receiver</p>
    </hgroup>

    <p class="muted" style="display:grid;grid-template-columns:auto 1fr;gap:.3rem .75rem;background:var(--pico-card-sectioning-background-color);padding:.75rem 1rem;border-radius:8px">
      <span>Session</span><span class="mono">{{.Nameplate}}</span>
      <span>Saving to</span><span><em>{{.Folder}}</em></span>
    </p>

    <div class="drop" x-data="{ over: false }"
      :class="{ over }"
      @click="$refs.file.click()"
      @dragover.prevent="over = true"
      @dragleave="over = false"
      @drop.prevent="over = false; add($event.dataTransfer.files)">
      <div class="icon">📂</div>
      <small class="muted">Drop files here</small>
    </div>

    <ul style="list-style:none;padding:0;max-height:200px;overflow:auto" x-show="files.length">
      <template x-for="(f, i) in files" :key="f.name + f.size">
        <li class="muted" style="display:flex;gap:.5rem;align-items:center;border-bottom:1px solid #23263a;padding:.35rem .25rem">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="f.name">
            <span x-text="f.name"></span> <span class="muted" x-text="'(' + fmtBytes(f.size) + ')'"></span>
          </span>
          <button class="secondary outline" style="padding:.1rem .4rem;width:auto" @click="remove(i)">✕</button>
        </li>
      </template>
    </ul>

    <div class="row">
      <button class="secondary" @click="$refs.file.click()">Browse</button>
      <button @click="upload()" x-bind:disabled="!files.length">Upload</button>
    </div>

    <p class="center" :class="statusClass" x-text="status"></p>

    <input type="file" x-ref="file" multiple hidden @change="add($event.target.files); $event.target.value = ''">
  </article>
</main>
</body>
</html>
