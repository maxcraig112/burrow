<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burrow</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/upload.css">
</head>
<body>
<header class="page-header">
  <a class="home-btn" href="/">← Burrow</a>
</header>
<div class="main-area">
<div class="card">
  <div class="logo">Burrow</div>
  <div class="sub">Send files to the receiver</div>

  <div class="session-info">
    <span class="info-label">Session</span>
    <span class="info-value">{{.Nameplate}}</span>
    {{if .Description}}
    <span class="info-label">Note</span>
    <span class="info-value info-plain">{{.Description}}</span>
    {{end}}
    <span class="info-label">Saving to</span>
    <span class="info-value info-plain">{{.Folder}}</span>
  </div>

  <div class="drop" id="drop">
    <div class="drop-icon">📂</div>
    <div class="drop-text">Drop files here</div>
  </div>

  <div class="file-list" id="file-list"></div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="browse-btn" type="button">Browse</button>
    <button class="btn btn-primary"   id="upload-btn" type="button" disabled>Upload</button>
  </div>

  <div class="status" id="status"></div>
  <div class="all-sessions"><a href="/active">View all active sessions →</a></div>
  <div class="close-session"><button class="btn-close" id="close-btn" type="button">Close session</button></div>
  <input type="file" id="file-input" multiple accept="*/*">
</div>
</div>
<script>window.NAMEPLATE = "{{.Nameplate}}";</script>
<script src="/static/utils.js"></script>
<script src="/static/upload-page.js"></script>
</body>
</html>
